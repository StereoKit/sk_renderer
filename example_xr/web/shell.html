<!doctype html>
<!--
  Custom emscripten shell for the sk_renderer example.

  Emscripten substitutes {{{ SCRIPT }}} with the generated .js loader at link
  time (wired up via - -shell-file in example/CMakeLists.txt). sk_app binds
  the canvas element with id "canvas" and, for resizable windows, sizes it to
  fill the viewport — the header here is a fixed overlay so it never affects
  canvas layout. (Avoid starting any line in this file with a '#': the shell
  preprocessor reads that as a directive.)

  Embedding elsewhere (e.g. a blog post):
    * Easiest: <iframe src="sk_renderer_test.html"> — fully self-contained.
    * Native:  copy the .js/.wasm/.data next to your page, add a
      <canvas id="canvas"> plus var Module = { canvas: ... }, and include the
      .js with a <script> tag. Style the canvas however the page likes;
      sk_app tracks its CSS size.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>sk_renderer XR — StereoKit</title>
	<style>
		:root {
			--sk-bg:     #14161a;
			--sk-panel:  #1c2026cc;
			--sk-text:   #e8eaed;
			--sk-dim:    #9aa0a6;
			--sk-accent: #45a8ff;
		}
		html, body { margin: 0; height: 100%; background: var(--sk-bg); overflow: hidden; }
		canvas {
			display: block;
			outline: none;
			-webkit-tap-highlight-color: transparent;
		}

		.sk-header {
			position: fixed;
			top: 0; left: 0; right: 0;
			z-index: 10;
			display: flex;
			align-items: baseline;
			gap: 0.6em;
			padding: 10px 16px;
			pointer-events: none; /* clicks fall through to the canvas */
			font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
			color: var(--sk-text);
			background: linear-gradient(to bottom, #14161ae6, #14161a00);
			user-select: none;
		}
		.sk-header .name   { color: var(--sk-accent); }
		.sk-header .detail { color: var(--sk-dim); font-weight: 400; font-size: 12px; }
		.sk-header a       { color: var(--sk-dim); pointer-events: auto; }

		.sk-overlay {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
			background: var(--sk-bg);
			color: var(--sk-dim);
			font: 400 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
			transition: opacity 0.25s ease;
		}
		.sk-overlay.hidden { opacity: 0; pointer-events: none; }
		.sk-overlay .spinner {
			width: 28px; height: 28px;
			border: 3px solid #2b3037;
			border-top-color: var(--sk-accent);
			border-radius: 50%;
			animation: sk-spin 0.9s linear infinite;
		}
		.sk-overlay.error .spinner { display: none; }
		.sk-overlay.error          { color: var(--sk-text); }
		@keyframes sk-spin { to { transform: rotate(360deg); } }

		/* WebXR will not start an immersive session without a user gesture, so
		   there has to be something to press. WebOpenXR looks for this exact id
		   and wires up the click itself - the page supplies the button and its
		   styling, the runtime supplies the behaviour. Leaving it out is legal
		   (the runtime injects a plain one), but then it looks like a stray
		   browser control rather than part of the app. */
		#wxr-enter-vr {
			position: fixed;
			right: 16px; bottom: 16px;
			z-index: 30;
			font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif;
			padding: 14px 28px;
			border: 0; border-radius: 10px;
			background: var(--sk-accent);
			color: #06121f;
			cursor: pointer;
		}
		#wxr-enter-vr[disabled] {
			background: #2b3037;
			color: var(--sk-dim);
			cursor: default;
		}
	</style>
</head>
<body>
	<div class="sk-header">
		<span class="name">StereoKit</span>
		<span>sk_renderer</span>
		<span class="detail">WebGPU</span>
	</div>

	<div class="sk-overlay" id="sk-overlay">
		<div class="spinner"></div>
		<div id="sk-status">Loading…</div>
	</div>

	<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

	<!-- Starts hidden. WebOpenXR unhides it when the app calls xrCreateSession,
	     then asks isSessionSupported and disables it (with the reason as its
	     label) if the browser can't offer that mode. So it appears only once
	     there is something to press, and says so when there isn't. -->
	<button id="wxr-enter-vr" hidden>Enter VR</button>

	<script>
		var Module = {
			canvas: document.getElementById('canvas'),
			setStatus: function (text) {
				var el = document.getElementById('sk-status');
				if (el && text) el.textContent = text;
			},
			onRuntimeInitialized: function () {
				var overlay = document.getElementById('sk-overlay');
				if (overlay) overlay.classList.add('hidden');
			},
		};

		// Fail early and visibly on browsers without WebGPU; the wasm side
		// reports it too, but a plain message beats a stuck spinner
		if (!navigator.gpu) {
			var overlay = document.getElementById('sk-overlay');
			var status  = document.getElementById('sk-status');
			overlay.classList.add('error');
			status.innerHTML = 'This page needs <a style="color:#45a8ff" href="https://caniuse.com/webgpu">WebGPU</a>, ' +
				'which this browser doesn\'t have enabled.';
		}
	</script>
	{{{ SCRIPT }}}
</body>
</html>
